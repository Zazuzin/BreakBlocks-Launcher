[project]
name = "breakblocks-launcher"
version = "0.9.6"
description = "Independent Minecraft launcher for the BreakBlocks community"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "customtkinter==5.2.2",
    "darkdetect==0.8.0",
    "Pillow==12.3.0",
    "packaging==25.0",
    "PySide6==6.8.3",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E7", "E9", "F", "I"]
