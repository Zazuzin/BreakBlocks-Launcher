name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release metadata
        shell: pwsh
        run: |
          $version = python -c "from app_config import APP_VERSION_NUMBER; print(APP_VERSION_NUMBER)"
          $stage = python -c "from app_config import APP_RELEASE_STAGE; print(APP_RELEASE_STAGE)"
          if ($stage -eq "Alpha") {
            $channel = "alpha"
            $suffix = "-alpha"
          } elseif ($stage -eq "Stable") {
            $channel = "stable"
            $suffix = ""
          } else {
            throw "APP_RELEASE_STAGE must be Alpha or Stable"
          }
          if ("v$version$suffix" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match $version $stage"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check and build Windows package
        shell: pwsh
        run: .\packaging\windows\build.ps1 -PythonExecutable (Get-Command python).Source
      - name: Verify unsigned Windows executable
        shell: pwsh
        run: |
          $executable = "dist\BreakBlocks Launcher\BreakBlocks Launcher.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "The Windows executable is missing from the build"
          }
          $signature = Get-AuthenticodeSignature $executable
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned Windows executable: $($signature.Status)"
          }
      - name: Package Windows release
        shell: pwsh
        run: |
          Rename-Item "dist\BreakBlocks Launcher" "BreakBlocks-Launcher"
          $archive = "BreakBlocks-Launcher-$env:VERSION-Windows-x86_64.zip"
          Compress-Archive -Path "dist\BreakBlocks-Launcher" -DestinationPath $archive -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: BreakBlocks-Launcher-*-Windows-x86_64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tk and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb xauth openbox libxtst6 libegl1 libopengl0 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          python -m pip install -r requirements-dev.txt
      - name: Verify release metadata
        run: |
          version="$(python -c 'from app_config import APP_VERSION_NUMBER; print(APP_VERSION_NUMBER)')"
          stage="$(python -c 'from app_config import APP_RELEASE_STAGE; print(APP_RELEASE_STAGE)')"
          case "$stage" in
            Alpha) channel=alpha; suffix=-alpha ;;
            Stable) channel=stable; suffix= ;;
            *) echo "APP_RELEASE_STAGE must be Alpha or Stable" >&2; exit 1 ;;
          esac
          test "v${version}${suffix}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "ASSET_SUFFIX=${suffix}" >> "$GITHUB_ENV"
      - name: Check formatting and tests
        run: |
          python -m black --check --line-length 100 *.py tests tools
          python -m ruff check *.py tests tools
          export PYTHONPATH="$PWD"
          for test_file in tests/test_*.py; do python "$test_file"; done
          QTWEBENGINE_DISABLE_SANDBOX=1 xvfb-run -a python tools/check_linux_desktop.py
      - name: Collect third-party licences
        run: python tools/collect_dependency_licenses.py --output third-party-licenses
      - name: Build Linux package
        run: python -m PyInstaller --noconfirm --clean BreakBlocksLauncher.spec
      - name: Package Steam Deck release
        run: |
          cp README.txt "dist/BreakBlocks Launcher/README.txt"
          cp LICENSE PRIVACY.md TERMS.md THIRD-PARTY-NOTICES.md "dist/BreakBlocks Launcher/"
          cp -R fonts "dist/BreakBlocks Launcher/fonts"
          cp -R third-party-licenses "dist/BreakBlocks Launcher/third-party-licenses"
          mv "dist/BreakBlocks Launcher" dist/BreakBlocks-Launcher
          chmod +x "dist/BreakBlocks-Launcher/BreakBlocks Launcher"
          tar -C dist -czf "BreakBlocks-Launcher-${VERSION}-SteamDeck-x86_64.tar.gz" BreakBlocks-Launcher
      - name: Build Ubuntu package
        run: |
          ./packaging/linux/build-deb.sh
          cp "dist-release/BreakBlocks-Launcher-${VERSION}-Ubuntu-amd64.deb" .
      - name: Check Linux desktop chat and overlay
        env:
          PYTHONPATH: .
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a python tools/check_linux_desktop.py "dist/BreakBlocks-Launcher/BreakBlocks Launcher" --ubuntu-package "BreakBlocks-Launcher-${VERSION}-Ubuntu-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            BreakBlocks-Launcher-*-Ubuntu-amd64.deb
            BreakBlocks-Launcher-*-SteamDeck-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build source archive and update manifest
        run: |
          version="$(python -c 'from app_config import APP_VERSION_NUMBER; print(APP_VERSION_NUMBER)')"
          stage="$(python -c 'from app_config import APP_RELEASE_STAGE; print(APP_RELEASE_STAGE)')"
          case "$stage" in
            Alpha) channel=alpha; suffix=-alpha ;;
            Stable) channel=stable; suffix= ;;
            *) echo "APP_RELEASE_STAGE must be Alpha or Stable" >&2; exit 1 ;;
          esac
          test "v${version}${suffix}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "ASSET_SUFFIX=${suffix}" >> "$GITHUB_ENV"
          git archive --format=zip --prefix=BreakBlocks-Launcher-Source/ \
            --output="release-assets/BreakBlocks-Launcher-${version}-source.zip" HEAD
          python tools/generate_update_manifest.py \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --channel "$channel" \
            --repository "$GITHUB_REPOSITORY" \
            --assets-dir release-assets \
            --output release-assets/breakblocks-update.json
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="BreakBlocks Launcher ${VERSION}"
          prerelease=()
          if [ "$CHANNEL" = alpha ]; then
            title="$title Alpha"
            prerelease+=(--prerelease)
          fi
          cat > "$RUNNER_TEMP/breakblocks-release-notes.md" <<'EOF'
          This is an unsigned Windows build. Windows and your browser may warn or block it.
          Download only from this project's official GitHub release page. Check the SHA-256
          checksum if you want to verify the download. Do not disable security protections
          to run it.

          See CHANGELOG.md in the source archive for changes in this version.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --draft \
            --notes-file "$RUNNER_TEMP/breakblocks-release-notes.md" \
            --title "$title" \
            "${prerelease[@]}"
